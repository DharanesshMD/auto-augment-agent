[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "auto-augment-agent"
version = "0.1.0"
description = "Autonomous Data-Augmentation & Tuning Agent — iteratively discovers augmentation pipelines and hyperparameters that improve your model."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Dharun", email = "dharun@example.com"},
]
keywords = ["machine-learning", "data-augmentation", "hyperparameter-tuning", "autonomous-agent"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    # Core ML
    "torch>=2.1.0",
    "transformers>=4.36.0",
    "datasets>=2.16.0",
    "peft>=0.7.0",
    "accelerate>=0.25.0",
    # Config
    "pyyaml>=6.0",
    "jsonschema>=4.20.0",
    # LLM providers (via litellm for universal support)
    "litellm>=1.20.0",
    # Experiment tracking (optional, installed via extras)
    # CLI & UX
    "rich>=13.0.0",
    "click>=8.1.0",
    # Git integration
    "gitpython>=3.1.40",
    # Safety
    "presidio-analyzer>=2.2.0",
    "presidio-anonymizer>=2.2.0",
    # Utilities
    "python-dotenv>=1.0.0",
    "numpy>=1.24.0",
]

[project.optional-dependencies]
wandb = ["wandb>=0.16.0"]
mlflow = ["mlflow>=2.9.0"]
docker = ["docker>=7.0.0"]
cv = ["torchvision>=0.16.0", "pillow>=10.0.0"]
all = [
    "auto-augment-agent[wandb,mlflow,docker,cv]",
]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
]

[project.scripts]
ada = "src.cli:main"

[project.urls]
Homepage = "https://github.com/dharun/auto-augment-agent"
Repository = "https://github.com/dharun/auto-augment-agent"
Issues = "https://github.com/dharun/auto-augment-agent/issues"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

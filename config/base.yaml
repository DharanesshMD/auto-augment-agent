# =============================================================================
# Auto-Augment Agent — Base Configuration
# =============================================================================
# This file is generated by `ada init` and should NOT be edited by the agent.
# Only augmentations.yaml and tuning.yaml are agent-editable.
# =============================================================================

project:
  name: "auto-augment-agent"
  seed: 42
  output_dir: "outputs"
  log_dir: "logs"

# Model configuration — set during `ada init`
model:
  name: "gpt2"                          # gpt2 | distilbert-base-uncased | resnet18
  task: "language_modeling"              # language_modeling | text_classification | image_classification
  pretrained: true

# Dataset configuration — set during `ada init`
dataset:
  name: "wikitext"                       # wikitext | sst2 | cifar10 | custom
  subset: "wikitext-2-raw-v1"           # dataset subset (if applicable)
  custom_path: null                      # path to custom dataset (if task=custom)
  max_length: 512                        # max sequence length (NLP tasks)
  image_size: 32                         # image size (CV tasks)

# Training budget — controls how long each trial runs
training:
  max_steps: 500                         # ~5-10 min per trial on single GPU
  eval_every: 100                        # evaluate every N steps
  save_checkpoints: false                # save model checkpoints per trial
  device: "auto"                         # auto | cuda | cpu | mps
  fp16: true                             # mixed precision training
  dataloader_workers: 4

# Agent configuration
agent:
  max_trials: 50                         # total trials to run
  improvement_threshold: 0.005           # 0.5% relative improvement to accept
  metric: "eval_loss"                    # primary metric to optimize
  metric_direction: "minimize"           # minimize | maximize
  patience: 10                           # stop if no improvement for N trials
  exploration_trials: 10                 # first N trials favor exploration
  seed_variations: 1                     # trials per config (>1 for statistical significance)

# LLM provider for config proposals — set during `ada init`
llm:
  provider: "ollama"                     # openai | anthropic | ollama | litellm
  model: "llama3"                        # model name for the provider
  temperature: 0.7
  max_tokens: 2048

# Experiment tracking — set during `ada init`
tracking:
  backend: "none"                        # wandb | mlflow | none
  project: "auto-augment-agent"
  entity: null                           # W&B entity / MLflow tracking URI

# Execution mode — set during `ada init`
execution:
  mode: "local"                          # local | docker
  docker_image: "auto-augment-agent:latest"
  gpu_ids: "0"                           # comma-separated GPU IDs
  memory_limit: "16g"                    # Docker memory limit
  network: false                         # disable network in trial containers

# Optional modules — toggled during `ada init`
modules:
  web_fetcher: false
  lora: false

# =============================================================================
# Tuning Hyperparameters Configuration
# =============================================================================
# This file IS editable by the autonomous agent.
# Changes are validated against config/schema/tuning_schema.json.
# =============================================================================

optimizer:
  name: "adamw"                          # adamw | adam | sgd | adafactor
  learning_rate: 5.0e-5
  weight_decay: 0.01
  betas: [0.9, 0.999]
  eps: 1.0e-8
  momentum: 0.9                          # SGD only

scheduler:
  name: "cosine"                         # cosine | linear | constant | cosine_with_restarts
  warmup_steps: 50
  num_cycles: 1                          # cosine_with_restarts only

batch:
  train_batch_size: 8
  eval_batch_size: 16
  gradient_accumulation_steps: 1

regularization:
  dropout: 0.1
  attention_dropout: 0.1
  label_smoothing: 0.0
  max_grad_norm: 1.0

lora:
  enabled: false
  rank: 8
  alpha: 16
  target_modules: ["q_proj", "v_proj"]
  dropout: 0.05
  bias: "none"                           # none | all | lora_only
